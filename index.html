<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mycode</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: 70px auto;
}

header {
  margin-bottom: 35px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
}

.logo span {
  color: #777;
}

.subtitle {
  margin-top: 8px;
  color: #777;
  font-size: 14px;
}

.editor {
  background: #050505;
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
}

.editor-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 15px;
  border-bottom: 1px solid #1c1c1c;
  font-size: 13px;
  color: #777;
}

textarea {
  width: 100%;
  height: 340px;
  padding: 18px;
  border: 0;
  outline: none;
  resize: vertical;

  background: #050505;
  color: #ddd;

  font-family: Consolas, "Courier New", monospace;
  font-size: 14px;
  line-height: 1.6;
}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid #292929;
  background: #111;
  color: #eee;

  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #181818;
}

.clear {
  color: #888;
}

.results {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid #222;
  display: none;
}

.results h2 {
  margin: 0 0 18px;
  font-size: 16px;
}

.language-bar {
  display: flex;
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 10px;
  background: #111;
  margin-bottom: 15px;
}

.language-segment {
  height: 100%;
}

.language-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.language {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.percent {
  color: #888;
}

.empty {
  color: #555;
  font-size: 13px;
}

footer {
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid #181818;

  color: #444;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">my<span>code</span></div>
    <div class="subtitle">
      Paste code. See what it's made of.
    </div>
  </header>

  <div class="editor">

    <div class="editor-top">
      <span>code</span>
      <span id="lineCount">0 lines</span>
    </div>

    <textarea
      id="code"
      spellcheck="false"
      placeholder="// paste your code here..."
    ></textarea>

  </div>

  <div class="actions">
    <button onclick="analyze()">Analyze</button>
    <button class="clear" onclick="clearCode()">Clear</button>
  </div>

  <div class="results" id="results">

    <h2>Languages</h2>

    <div class="language-bar" id="languageBar"></div>

    <div class="language-list" id="languageList"></div>

  </div>

  <footer>
    mycode / code stays in your browser
  </footer>

</div>

<script>
const codeBox = document.getElementById("code");
const results = document.getElementById("results");
const languageBar = document.getElementById("languageBar");
const languageList = document.getElementById("languageList");
const lineCount = document.getElementById("lineCount");

const languages = {
  JavaScript: {
    color: "#f1e05a",
    patterns: [
      /\bconst\b/g,
      /\blet\b/g,
      /\bvar\b/g,
      /\bfunction\b/g,
      /=>/g,
      /console\./g,
      /document\./g,
      /require\(/g,
      /import .* from/g
    ]
  },

  HTML: {
    color: "#e34c26",
    patterns: [
      /<!DOCTYPE html>/gi,
      /<html/gi,
      /<head/gi,
      /<body/gi,
      /<div/gi,
      /<span/gi,
      /<button/gi,
      /<script/gi
    ]
  },

  CSS: {
    color: "#563d7c",
    patterns: [
      /#[a-zA-Z0-9_-]+\s*\{/g,
      /\.[a-zA-Z0-9_-]+\s*\{/g,
      /background\s*:/g,
      /color\s*:/g,
      /display\s*:/g,
      /margin\s*:/g,
      /padding\s*:/g,
      /font-family\s*:/g
    ]
  },

  Python: {
    color: "#3572A5",
    patterns: [
      /\bdef\b/g,
      /\bimport\b/g,
      /\bfrom\b.*\bimport\b/g,
      /\bprint\(/g,
      /\basync def\b/g,
      /\bclass\b/g,
      /__name__/g
    ]
  },

  JSON: {
    color: "#aaa",
    patterns: [
      /"[^"]+"\s*:/g,
      /\{\s*"/g
    ]
  },

  SQL: {
    color: "#e38c00",
    patterns: [
      /\bSELECT\b/gi,
      /\bFROM\b/gi,
      /\bWHERE\b/gi,
      /\bINSERT INTO\b/gi,
      /\bUPDATE\b/gi,
      /\bCREATE TABLE\b/gi
    ]
  }
};

codeBox.addEventListener("input", () => {
  const value = codeBox.value.trim();

  if (!value) {
    lineCount.textContent = "0 lines";
    return;
  }

  const lines = codeBox.value.split("\n").length;

  lineCount.textContent =
    lines === 1 ? "1 line" : `${lines} lines`;
});

function analyze() {
  const code = codeBox.value;

  if (!code.trim()) return;

  let scores = {};
  let total = 0;

  for (const [language, data] of Object.entries(languages)) {

    let score = 0;

    data.patterns.forEach(pattern => {
      const matches = code.match(pattern);

      if (matches) {
        score += matches.length;
      }
    });

    if (score > 0) {
      scores[language] = score;
      total += score;
    }
  }

  languageBar.innerHTML = "";
  languageList.innerHTML = "";

  if (!total) {
    languageList.innerHTML =
      '<div class="empty">No language detected.</div>';

    results.style.display = "block";
    return;
  }

  const sorted = Object.entries(scores)
    .sort((a, b) => b[1] - a[1]);

  sorted.forEach(([language, score]) => {

    const percentage =
      ((score / total) * 100).toFixed(1);

    const color = languages[language].color;

    const segment = document.createElement("div");

    segment.className = "language-segment";
    segment.style.width = percentage + "%";
    segment.style.background = color;

    languageBar.appendChild(segment);

    const item = document.createElement("div");

    item.className = "language";

    item.innerHTML = `
      <span class="dot" style="background:${color}"></span>
      <strong>${language}</strong>
      <span class="percent">${percentage}%</span>
    `;

    languageList.appendChild(item);
  });

  results.style.display = "block";
}

function clearCode() {
  codeBox.value = "";
  results.style.display = "none";
  lineCount.textContent = "0 lines";
}
</script>

</body>
</html>
